[package]
name = "rtl9617c-factory"
version = "0.3.0"
edition = "2021"
license = "GPL-2.0-only"
description = "RTL9617C factory image tool - egui GUI + CLI + dual output formats (RTLFACT1 and upstream fixed-offset)"

[lib]
name = "rtl9617c_factory"
path = "src/lib.rs"

[[bin]]
name = "rtl9617c-factory"
path = "src/bin/cli.rs"

[[bin]]
name = "rtl9617c-factory-inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "rtl9617c-factory-gui"
path = "src/bin/gui/main.rs"
# 无 GUI 依赖的环境下（cargo test --no-default-features）跳过该二进制
required-features = ["gui"]

[dependencies]
lzokay-native = { version = "0.1", default-features = false, features = ["decompress"] }
flate2 = "1"
# GUI 依赖（与 h3c-factory 同一套）：eframe/egui 0.36、rfd 文件对话框、
# fontdb + ttf-parser 用于安装系统 CJK 字体。
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"], optional = true }
rfd = { version = "0.17", optional = true }
fontdb = { version = "0.23", optional = true }
ttf-parser = { version = "0.25", optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:fontdb", "dep:ttf-parser"]
# eframe default-features=false leaves Linux with no windowing backend; the
# optional feature enables eframe/x11 (same trick as h3c-factory / upstream).
linux-x11 = ["eframe/x11"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
